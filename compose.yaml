name: universe-atlas
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local
      POSTGRES_DB: universe_atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d universe_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  atlas_postgres:
